name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev zlib1g-dev build-essential cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Strip binary
        run: strip build/gdlauncher

      - name: Report binary size
        run: ls -lh build/gdlauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdlauncher-linux-x86_64-${{ github.sha }}
          path: build/gdlauncher
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'

      - name: Install zlib (vcpkg)
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install zlib:x64-windows

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -j

      - name: Deploy Qt runtime
        run: windeployqt --release build\Release\gdlauncher.exe
        shell: cmd

      - name: Copy zlib runtime
        run: |
          $dll = Get-ChildItem -Path C:\vcpkg\installed -Recurse -Filter 'zlib*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName build\Release\
            Write-Host "Copied $($dll.FullName)"
          } else {
            Write-Host "No zlib DLL found; assuming it was linked statically."
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdlauncher-windows-x86_64-${{ github.sha }}
          path: build/Release
          if-no-files-found: error

  windows-verbose-logging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'

      - name: Install zlib (vcpkg)
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install zlib:x64-windows

      # Verbose live logging (version detection, download/extraction progress, instance ops,
      # launch steps) baked in, and -- unlike the plain release build above -- keeps the
      # console subsystem so output is visible when run from a terminal. Deliberately still a
      # Release *build type* (optimized, release CRT): a true Debug build links the MSVC debug
      # CRT (ucrtbased.dll, msvcp140d.dll, ...), which isn't redistributable, won't run without
      # a Visual Studio install, and its rarity/oddity is exactly what got a Debug-built exe
      # flagged as a false positive by a scanner. This gets the same live logging without any
      # of that.
      - name: Configure (Release + verbose logging)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGDLAUNCHER_DEBUG_LOGGING=ON -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -j

      - name: Deploy Qt runtime
        run: windeployqt --release build\Release\gdlauncher.exe
        shell: cmd

      - name: Copy zlib runtime
        run: |
          $dll = Get-ChildItem -Path C:\vcpkg\installed -Recurse -Filter 'zlib*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName build\Release\
            Write-Host "Copied $($dll.FullName)"
          } else {
            Write-Host "No zlib DLL found; assuming it was linked statically."
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdlauncher-windows-x86_64-verbose-logging-${{ github.sha }}
          path: build/Release
          if-no-files-found: error
