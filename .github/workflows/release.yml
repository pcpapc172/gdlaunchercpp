name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev zlib1g-dev build-essential cmake ninja-build rpm

      # A real tagged release: just the version number (the tag minus its leading "v"), no
      # commit suffix.
      - name: Compute app version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGDLAUNCHER_APP_VERSION="$APP_VERSION"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Strip binary
        run: strip build/gdlauncher

      - name: Package (tarball)
        run: |
          mkdir -p dist
          tar -C build -czf dist/gdlauncher-linux-x86_64.tar.gz gdlauncher

      - name: Package (.deb / .rpm)
        working-directory: build
        run: |
          cpack -G "DEB;RPM"
          mv gdlauncher-*-amd64.deb ../dist/
          mv gdlauncher-*.x86_64.rpm ../dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'

      - name: Install zlib (vcpkg)
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install zlib:x64-windows

      # A real tagged release: just the version number (the tag minus its leading "v"), no
      # commit suffix.
      - name: Compute app version
        run: echo "APP_VERSION=$("${{ github.ref_name }}" -replace '^v', '')" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGDLAUNCHER_APP_VERSION="$env:APP_VERSION" -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -j

      - name: Deploy Qt runtime
        run: windeployqt --release build\Release\gdlauncher.exe
        shell: cmd

      - name: Copy zlib runtime
        run: |
          $dll = Get-ChildItem -Path C:\vcpkg\installed -Recurse -Filter 'zlib*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName build\Release\
            Write-Host "Copied $($dll.FullName)"
          } else {
            Write-Host "No zlib DLL found; assuming it was linked statically."
          }
        shell: pwsh

      - name: Package (zip)
        run: |
          mkdir dist
          Compress-Archive -Path build\Release\* -DestinationPath dist\gdlauncher-windows-x86_64.zip
        shell: pwsh

      # windows-latest images ship NSIS and WiX Toolset v3 already, but install explicitly
      # rather than assume -- a missing toolset should fail loudly, not silently skip a
      # package.
      - name: Install NSIS + WiX Toolset
        run: choco install nsis wixtoolset -y --no-progress
        shell: cmd

      - name: Package (NSIS .exe / WiX .msi)
        working-directory: build
        # A packaging failure here (e.g. a WiX config issue) shouldn't sink the whole release --
        # the zip built above is still a complete, valid artifact on its own. The ::error::
        # annotations below still surface in the job log/summary either way.
        continue-on-error: true
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          # CPACK_INSTALLED_DIRECTORIES packages this directory's contents verbatim into bin/,
          # since the exe alone (via install(TARGETS)) is missing the Qt/zlib DLLs that
          # windeployqt just deployed alongside it above -- those aren't part of any CMake
          # install() rule.
          $installArg = "CPACK_INSTALLED_DIRECTORIES=$pwd\Release;bin"

          # Run each generator separately and move its output the moment it exists, so a
          # failure in one (e.g. WiX license/config issues) can't also lose the other's
          # already-built package -- a single combined "-G NSIS;WIX" call with one Move-Item
          # at the end did exactly that.
          $failed = $false

          cpack -D $installArg -G NSIS
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::NSIS packaging failed (exit $LASTEXITCODE)"
            $failed = $true
          } else {
            $exe = Get-ChildItem *.exe | Select-Object -First 1
            if ($exe) { Move-Item $exe.FullName ..\dist\gdlauncher-windows-x86_64-installer.exe }
            else { Write-Host "::error::cpack reported success but no .exe was found"; $failed = $true }
          }

          cpack -D $installArg -G WIX
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::WiX packaging failed (exit $LASTEXITCODE)"
            $failed = $true
          } else {
            $msi = Get-ChildItem *.msi | Select-Object -First 1
            if ($msi) { Move-Item $msi.FullName ..\dist\gdlauncher-windows-x86_64.msi }
            else { Write-Host "::error::cpack reported success but no .msi was found"; $failed = $true }
          }

          if ($failed) { exit 1 }
        shell: pwsh

      - name: Upload artifact
        # Runs even if NSIS/WiX packaging failed above, so the zip (already moved into dist/
        # before that step) still gets published instead of the whole platform's release
        # silently disappearing over an installer-only problem.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GDLauncher ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
